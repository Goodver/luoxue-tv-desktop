<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    #back {
      display: flex;
      align-items: center;
      height: 36px;
      padding: 0 16px;
      border-radius: 18px;
      cursor: pointer;
      user-select: none;
      font: 600 14px "Microsoft YaHei", "Segoe UI", sans-serif;
      color: #fff;
      background: rgba(30, 30, 40, .55);
      border: 1px solid rgba(255, 255, 255, .35);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
      backdrop-filter: blur(4px);
      opacity: .45;
      transition: opacity .2s, background .2s, border-color .2s;
    }
    #back:hover {
      opacity: 1;
      background: rgba(124, 77, 255, .92);
      border-color: rgba(255, 255, 255, .6);
    }
  </style>
</head>
<body>
  <div id="back">← 返回</div>
</body>
</html>
